<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Admin</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/ticker.css">
</head>
<body>
<div class="scroll-page" style="background-image: url('images/dash.screens/dashboard-scroll.jpg');">
  <div class="scroll-panel" style="max-height: 78vh;">
    <h1>ADMIN CONSOLE</h1>

    <div class="section-label">Players (scroll to see more)</div>
    <div id="playerList"></div>

    <div class="section-label">Referrals</div>
    <div id="referralList"></div>

    <div class="section-label">Player Feedback &amp; Bug Reports</div>
    <div id="feedbackList"></div>

    <div class="probability-settings-panel" id="probabilitySettingsPanel" hidden>
      <button type="button" class="probability-modal-close" id="closeProbabilitySettingsBtn" aria-label="Close">×</button>
      <h2 class="probability-modal-title">Probability Settings</h2>
      <label class="probability-game-label" for="probabilityTargetScope">Apply settings to</label>
      <select id="probabilityTargetScope" class="probability-game-select">
        <option value="all" selected>Everyone — All Current &amp; Future Players</option>
        <option value="player">One Individual Player</option>
      </select>

      <div id="probabilityPlayerPicker" hidden>
        <label class="probability-game-label" for="probabilityPlayerUid">Choose signed-up player</label>
        <select id="probabilityPlayerUid" class="probability-game-select"></select>
      </div>

      <label class="probability-game-label" for="probabilityGameScope">Adjust settings for</label>
      <select id="probabilityGameScope" class="probability-game-select">
        <option value="global">All Games</option>
        <option value="blue">Blue Diamonds</option>
        <option value="red">Red Devil</option>
      </select>

      <div class="probability-scope-note" id="probabilityScopeNote"></div>

      <div class="setting-row">
        <label>Win Probability <span class="val" id="valWinProb">10%</span></label>
        <input type="range" id="winProbability" min="0" max="100" value="10">
      </div>
      <div class="setting-row">
        <label>Joker Appearance Rate <span class="val" id="valJester">3%</span></label>
        <input type="range" id="jesterRate" min="0" max="100" value="3">
      </div>
      <div class="setting-row blue-only-setting" id="bonusRateRow">
        <label>Bonus Round Trigger Rate <span class="val" id="valBonusRate">14%</span></label>
        <input type="range" id="bonusRate" min="0" max="100" value="14">
      </div>
      <div class="setting-row">
        <label>Jackpot Event Rate <span class="val" id="valJackpotRate">1%</span></label>
        <input type="range" id="jackpotRate" min="0" max="100" value="1">
      </div>
      <div class="setting-row blue-only-setting" id="clusterMinRow">
        <label>Cluster Size Requirement <span class="val" id="valCluster">5</span></label>
        <input type="range" id="clusterMin" min="5" max="10" value="5">
      </div>

      <div class="probability-save-status" id="probabilitySaveStatus" role="status"></div>
      <button type="button" class="probability-save-btn" id="saveProbabilitySettingsBtn">
        Save Probability Settings
      </button>
      <button type="button" class="probability-cancel-btn" id="cancelProbabilitySettingsBtn">
        Cancel Without Saving
      </button>
      <button type="button" class="probability-reset-btn" id="resetPlayerProbabilitySettingsBtn" hidden>
        Reset This Player to Standard Settings
      </button>
    </div>
    <div class="probability-modal-backdrop" id="probabilityModalBackdrop" hidden></div>

    <div class="section-label probability-actions-label">Game Probability Controls</div>
    <button type="button" class="probability-open-btn" id="openProbabilitySettingsBtn">
      Open Probability Settings for Everyone or One Player
    </button>
    <button class="btn-secondary" id="viewAsPlayerBtn" style="margin-top: 10px;">View as Player</button>
    <button class="btn-secondary" id="signOutBtn" style="margin-top: 10px;">Sign Out</button>
  </div>
</div>

<div id="tickerBar" class="ticker-bar"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="js/ticker.js"></script>
<script>
  async function renderPlayers() {
    const list = document.getElementById("playerList");
    const [allPlayers, allRedemptions, globalSettings, blueSettings, redSettings] = await Promise.all([
      drGetPlayers(), drGetRedemptions(), drGetSettings("global"), drGetSettings("blue"), drGetSettings("red"),
    ]);
    const players = allPlayers;
    const settingsByScope = { global: globalSettings, blue: blueSettings, red: redSettings };

    if (players.length === 0) {
      list.innerHTML = '<div class="player-row">No players yet.</div>';
      return;
    }

    list.innerHTML = players.map((p) => {
      const mine = allRedemptions
        .filter((r) => r.uid === p.id)
        .sort((a, b) => b.createdAt - a.createdAt);

      const redeemHtml = mine.length === 0 ? "" : `
        <div class="redeem-list">
          <div class="redeem-list-label">Redemption Codes</div>
          ${mine.map((r) => `
            <div class="redeem-row" data-code="${r.code}">
              <span class="redeem-code-sm">${r.code}</span>
              <span class="redeem-amt-sm">${r.amount.toLocaleString()} cr</span>
              <span class="redeem-status ${r.status}">${r.status}</span>
              ${r.status === "pending" ? '<button class="fulfillBtn">Mark Fulfilled</button>' : ""}
            </div>
          `).join("")}
        </div>
      `;

      const approved = !!p.approved;
      const referredByPlayer = p.referredBy ? players.find((x) => x.id === p.referredBy) : null;
      const referredCount = players.filter((x) => x.referredBy === p.id).length;
      return `
        <div class="player-row" data-uid="${p.id}">
          <div class="email">
            ${p.email}
            ${p.role === "admin" ? '<span class="approval-badge approved">You (Admin)</span>' : ""}
            <span class="approval-badge ${approved ? "approved" : "pending"}">${approved ? "Approved" : "Pending"}</span>
          </div>
          ${p.role === "admin" ? "" : `
            <div class="roster-probability-control">
              <label>Individual Win Probability <span class="rosterWinValue"></span></label>
              <select class="rosterGameScope probability-game-select" aria-label="Game for ${escapeHtml(p.email)}">
                <option value="global">Both Games</option>
                <option value="blue">Blue Diamonds</option>
                <option value="red">Red Devil</option>
              </select>
              <input class="rosterWinProbability" type="range" min="0" max="100" value="10">
              <button type="button" class="saveRosterProbabilityBtn">Save Player Win Probability</button>
              <button type="button" class="openPlayerProbabilityBtn">More Player Probability Settings</button>
              <div class="rosterProbabilityStatus" role="status"></div>
            </div>
          `}
          <div class="mini-stats">
            <div>Time: <b>${p.timePlayingMinutes || 0}m</b></div>
            <div>Credits: <b>${(p.credits || 0).toLocaleString()}</b></div>
            <div>Played: <b>${(p.creditsPlayed || 0).toLocaleString()}</b></div>
            <div>Won: <b>${(p.creditsWon || 0).toLocaleString()}</b></div>
            <div>Lost: <b>${(p.creditsLost || 0).toLocaleString()}</b></div>
          </div>
          <div class="mini-stats">
            <div>Deposited: <b>${p.hasDeposited ? "Yes" : "No"}</b></div>
            <div>Referral Code: <b>${p.referralCode || "—"}</b></div>
            <div>Referred By: <b>${referredByPlayer ? referredByPlayer.email : "—"}</b></div>
            <div>Referrals Made: <b>${referredCount}</b></div>
          </div>
          ${approved ? "" : '<button class="approveBtn">Approve Account</button>'}
          <div class="add-credits-row">
            <input type="number" placeholder="Amount" class="creditInput" min="1">
            <button class="depositBtn">Add Deposit</button>
            <button class="bonusBtn">Add Bonus</button>
          </div>
          ${redeemHtml}
        </div>
      `;
    }).join("");

    list.querySelectorAll(".depositBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        const uid = row.dataset.uid;
        const input = row.querySelector(".creditInput");
        const amount = parseInt(input.value, 10);
        if (!amount || amount <= 0) return;
        btn.disabled = true;
        await drAddDeposit(uid, amount);
        input.value = "";
        await renderPlayers();
      });
    });

    list.querySelectorAll(".bonusBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        const uid = row.dataset.uid;
        const input = row.querySelector(".creditInput");
        const amount = parseInt(input.value, 10);
        if (!amount || amount <= 0) return;
        btn.disabled = true;
        await drAddBonusCredits(uid, amount);
        input.value = "";
        await renderPlayers();
      });
    });

    list.querySelectorAll(".fulfillBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".redeem-row");
        btn.disabled = true;
        await drSetRedemptionStatus(row.dataset.code, "fulfilled");
        await renderPlayers();
      });
    });

    list.querySelectorAll(".approveBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        btn.disabled = true;
        await drApprovePlayer(row.dataset.uid);
        await renderPlayers();
      });
    });

    list.querySelectorAll(".roster-probability-control").forEach((control) => {
      const row = control.closest(".player-row");
      const playerForRow = players.find((p) => p.id === row.dataset.uid);
      const scopeSelect = control.querySelector(".rosterGameScope");
      const slider = control.querySelector(".rosterWinProbability");
      const value = control.querySelector(".rosterWinValue");
      const status = control.querySelector(".rosterProbabilityStatus");

      const refresh = () => {
        const scope = scopeSelect.value;
        const effective = Object.assign(
          {}, settingsByScope[scope],
          drPlayerSettingsForGame(playerForRow && playerForRow.settingsOverride, scope)
        );
        slider.value = effective.winProbability;
        value.textContent = slider.value + "%";
        status.textContent = "";
      };
      refresh();
      scopeSelect.addEventListener("change", refresh);
      slider.addEventListener("input", () => { value.textContent = slider.value + "%"; });
      control.querySelector(".saveRosterProbabilityBtn").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        status.textContent = "Saving…";
        try {
          await drSetPlayerSettingsOverride(row.dataset.uid, {
            winProbability: parseInt(slider.value, 10),
          }, scopeSelect.value);
          status.textContent = "Saved — active on the player's next spin.";
        } catch (error) {
          console.error("Could not save roster probability", error);
          status.textContent = "Save failed. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
      control.querySelector(".openPlayerProbabilityBtn").addEventListener("click", () => {
        openProbabilitySettingsForPlayer(row.dataset.uid, scopeSelect.value);
      });
    });

  }

  async function renderReferrals() {
    const list = document.getElementById("referralList");
    const referrals = await drGetReferrals();

    if (referrals.length === 0) {
      list.innerHTML = '<div class="player-row">No referrals yet.</div>';
      return;
    }

    list.innerHTML = referrals.map((r) => `
      <div class="redeem-row" data-id="${r.id}">
        <span class="redeem-code-sm">${r.referrerEmail} → ${r.newPlayerEmail}</span>
        <span class="redeem-amt-sm">${r.code}</span>
        <span class="redeem-status ${r.rewarded ? "fulfilled" : "pending"}">${r.rewarded ? "rewarded" : "pending"}</span>
        ${r.rewarded ? "" : '<button class="fulfillBtn">Mark Rewarded</button>'}
      </div>
    `).join("");

    list.querySelectorAll(".fulfillBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".redeem-row");
        btn.disabled = true;
        await drMarkReferralRewarded(row.dataset.id);
        await renderReferrals();
      });
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  async function renderFeedback() {
    const list = document.getElementById("feedbackList");
    const items = await drGetFeedback();

    if (items.length === 0) {
      list.innerHTML = '<div class="player-row">No feedback submitted yet.</div>';
      return;
    }

    list.innerHTML = items.map((f) => {
      const date = new Date(f.createdAt).toLocaleString();
      const kindLabel = f.kind === "bug" ? "Bug" : "Comment";
      return `
        <div class="feedback-item" data-id="${f.id}">
          <div class="feedback-header">
            <span class="feedback-kind-tag ${f.kind === "bug" ? "bug" : ""}">${kindLabel}</span>
            <span class="feedback-email">${escapeHtml(f.email)}</span>
            <span class="feedback-date">${date}</span>
          </div>
          <div class="feedback-msg">${escapeHtml(f.message)}</div>
          ${f.status === "reviewed"
            ? '<span class="redeem-status fulfilled">Reviewed</span>'
            : '<button class="reviewBtn">Mark Reviewed</button>'}
        </div>
      `;
    }).join("");

    list.querySelectorAll(".reviewBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const item = e.target.closest(".feedback-item");
        btn.disabled = true;
        await drMarkFeedbackReviewed(item.dataset.id);
        await renderFeedback();
      });
    });
  }

  const PROBABILITY_CONTROLS = [
    { id: "winProbability", valId: "valWinProb", key: "winProbability", suffix: "%" },
    { id: "jesterRate", valId: "valJester", key: "jesterRate", suffix: "%" },
    { id: "bonusRate", valId: "valBonusRate", key: "bonusRate", suffix: "%" },
    { id: "jackpotRate", valId: "valJackpotRate", key: "jackpotRate", suffix: "%" },
    { id: "clusterMin", valId: "valCluster", key: "clusterMin", suffix: "" },
  ];

  function updateProbabilityValueLabels() {
    PROBABILITY_CONTROLS.forEach((control) => {
      const input = document.getElementById(control.id);
      document.getElementById(control.valId).textContent = input.value + control.suffix;
    });
  }

  async function loadProbabilitySettings() {
    const scope = document.getElementById("probabilityGameScope").value;
    const target = document.getElementById("probabilityTargetScope").value;
    const uid = document.getElementById("probabilityPlayerUid").value;
    let settings = await drGetSettings(scope);
    if (target === "player" && uid) {
      const selectedPlayer = await drFindPlayerByUid(uid);
      settings = Object.assign(
        {}, settings,
        drPlayerSettingsForGame(selectedPlayer && selectedPlayer.settingsOverride, scope)
      );
    }
    PROBABILITY_CONTROLS.forEach((control) => {
      document.getElementById(control.id).value = settings[control.key];
    });

    document.getElementById("clusterMinRow").hidden = scope === "red";
    const playerSelect = document.getElementById("probabilityPlayerUid");
    const playerLabel = playerSelect.options[playerSelect.selectedIndex]
      ? playerSelect.options[playerSelect.selectedIndex].textContent
      : "the selected player";
    const gameLabel = scope === "blue" ? "Blue Diamonds only"
      : scope === "red" ? "Red Devil only" : "both games";
    document.getElementById("probabilityScopeNote").textContent = target === "player"
      ? `Saving will affect ${playerLabel} in ${gameLabel}.`
      : `Saving will affect all players in ${gameLabel}.`;
    document.getElementById("probabilitySaveStatus").textContent = "";
    updateProbabilityValueLabels();
  }

  function initProbabilitySettings() {
    const panel = document.getElementById("probabilitySettingsPanel");
    const openBtn = document.getElementById("openProbabilitySettingsBtn");
    const saveBtn = document.getElementById("saveProbabilitySettingsBtn");
    const cancelBtn = document.getElementById("cancelProbabilitySettingsBtn");
    const scopeSelect = document.getElementById("probabilityGameScope");
    const targetSelect = document.getElementById("probabilityTargetScope");
    const playerSelect = document.getElementById("probabilityPlayerUid");
    const playerPicker = document.getElementById("probabilityPlayerPicker");
    const resetBtn = document.getElementById("resetPlayerProbabilitySettingsBtn");
    const status = document.getElementById("probabilitySaveStatus");
    const closeBtn = document.getElementById("closeProbabilitySettingsBtn");
    const backdrop = document.getElementById("probabilityModalBackdrop");

    PROBABILITY_CONTROLS.forEach((control) => {
      document.getElementById(control.id).addEventListener("input", updateProbabilityValueLabels);
    });

    async function openSettings(requestedUid, requestedScope) {
      const openingForPlayer = Boolean(requestedUid);
      targetSelect.value = openingForPlayer ? "player" : "all";
      playerPicker.hidden = !openingForPlayer;
      resetBtn.hidden = !openingForPlayer;
      saveBtn.disabled = false;
      if (!openingForPlayer) playerSelect.value = "";
      panel.hidden = false;
      backdrop.hidden = false;
      openBtn.hidden = true;
      document.body.classList.add("probability-modal-open");
      status.textContent = "Loading saved settings…";
      try {
        const players = await drGetPlayers();
        playerSelect.innerHTML = players
          .filter((p) => p.role !== "admin")
          .sort((a, b) => String(a.email).localeCompare(String(b.email)))
          .map((p) => `<option value="${p.id}">${escapeHtml(p.email)}</option>`)
          .join("");
        if (openingForPlayer) {
          playerSelect.value = requestedUid;
        }
        if (requestedScope) scopeSelect.value = requestedScope;
        await loadProbabilitySettings();
      } catch (error) {
        console.error("Could not load probability settings", error);
        status.textContent = "Could not load saved settings. Close and try again.";
      }
    }

    window.openProbabilitySettingsForPlayer = openSettings;
    openBtn.addEventListener("click", () => openSettings());

    scopeSelect.addEventListener("change", loadProbabilitySettings);
    playerSelect.addEventListener("change", loadProbabilitySettings);
    targetSelect.addEventListener("change", async () => {
      const isPlayer = targetSelect.value === "player";
      playerPicker.hidden = !isPlayer;
      resetBtn.hidden = !isPlayer;
      saveBtn.disabled = isPlayer && !playerSelect.value;
      await loadProbabilitySettings();
    });

    const closeSettings = () => {
      panel.hidden = true;
      backdrop.hidden = true;
      openBtn.hidden = false;
      document.body.classList.remove("probability-modal-open");
      status.textContent = "";
    };
    cancelBtn.addEventListener("click", closeSettings);
    closeBtn.addEventListener("click", closeSettings);
    backdrop.addEventListener("click", closeSettings);

    saveBtn.addEventListener("click", async () => {
      const scope = scopeSelect.value;
      const target = targetSelect.value;
      const uid = playerSelect.value;
      if (target === "player" && !uid) {
        status.textContent = "Choose a player first.";
        return;
      }
      const partial = {
        winProbability: parseInt(document.getElementById("winProbability").value, 10),
        jesterRate: parseInt(document.getElementById("jesterRate").value, 10),
        bonusRate: parseInt(document.getElementById("bonusRate").value, 10),
        jackpotRate: parseInt(document.getElementById("jackpotRate").value, 10),
      };
      if (scope !== "red") {
        partial.clusterMin = parseInt(document.getElementById("clusterMin").value, 10);
      }

      saveBtn.disabled = true;
      cancelBtn.disabled = true;
      scopeSelect.disabled = true;
      targetSelect.disabled = true;
      playerSelect.disabled = true;
      status.textContent = "Saving…";
      try {
        if (target === "player") {
          await drSetPlayerSettingsOverride(uid, partial, scope);
        } else {
          await drSaveSettings(partial, scope);
        }
        status.textContent = "Saved successfully.";
        await new Promise((resolve) => setTimeout(resolve, 650));
        closeSettings();
      } catch (error) {
        console.error("Could not save probability settings", error);
        status.textContent = "Save failed. Please try again.";
      } finally {
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        scopeSelect.disabled = false;
        targetSelect.disabled = false;
        playerSelect.disabled = false;
      }
    });

    resetBtn.addEventListener("click", async () => {
      const uid = playerSelect.value;
      if (!uid) return;
      resetBtn.disabled = true;
      status.textContent = "Resetting…";
      try {
        await drResetPlayerSettings(uid);
        status.textContent = "Player reset to standard settings.";
        await loadProbabilitySettings();
      } catch (error) {
        console.error("Could not reset player settings", error);
        status.textContent = "Reset failed. Please try again.";
      } finally {
        resetBtn.disabled = false;
      }
    });
  }

  (async () => {
    const session = await drRequireSessionOrRedirect("signin.html");
    if (!session) return;
    const me = await drCurrentPlayer();
    if (!me || me.role !== "admin") {
      window.location.href = "dashboard.html";
      return;
    }

    initProbabilitySettings();
    const sections = await Promise.allSettled([renderPlayers(), renderReferrals(), renderFeedback()]);
    sections.forEach((result) => {
      if (result.status === "rejected") console.error("Admin section failed to load", result.reason);
    });
  })();

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await drClearSession();
    window.location.href = "signin.html";
  });

  document.getElementById("viewAsPlayerBtn").addEventListener("click", () => {
    drEnterPlayerView();
    window.location.href = "dashboard.html";
  });

  startTicker(document.getElementById("tickerBar"));
</script>
</body>
</html>
