<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Admin</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/ticker.css">
</head>
<body>
<div class="scroll-page" style="background-image: url('images/dash.screens/dashboard-scroll.jpg');">
  <div class="scroll-panel" style="max-height: 78vh;">
    <h1>ADMIN CONSOLE</h1>

    <div class="section-label">Players (scroll to see more)</div>
    <div id="playerList"></div>

    <div class="section-label">Referrals</div>
    <div id="referralList"></div>

    <div class="section-label">Player Feedback &amp; Bug Reports</div>
    <div id="feedbackList"></div>

    <div class="section-label">Global Game Settings (default for all players)</div>

    <div class="setting-row">
      <label>Win Probability <span class="val" id="valWinProb">35%</span></label>
      <input type="range" id="winProbability" min="0" max="100" value="35">
    </div>
    <div class="setting-row">
      <label>Jester Appearance Rate <span class="val" id="valJester">8%</span></label>
      <input type="range" id="jesterRate" min="0" max="100" value="8">
    </div>
    <div class="setting-row">
      <label>Average Free Spins Awarded <span class="val" id="valFreeSpins">15</span></label>
      <input type="range" id="avgFreeSpins" min="3" max="50" value="15">
    </div>
    <div class="setting-row">
      <label>Multiplier Frequency <span class="val" id="valMultFreq">50%</span></label>
      <input type="range" id="multiplierFrequency" min="0" max="100" value="50">
    </div>
    <div class="setting-row">
      <label>Mega Jackpot Chance <span class="val" id="valJackpot">1%</span></label>
      <input type="range" id="jackpotChance" min="0" max="100" value="1">
    </div>
    <div class="setting-row">
      <label>Cluster Size Requirement <span class="val" id="valCluster">5</span></label>
      <input type="range" id="clusterMin" min="3" max="10" value="5">
    </div>

    <button class="btn-secondary" id="viewAsPlayerBtn" style="margin-top: 10px;">View as Player</button>
    <button class="btn-secondary" id="signOutBtn" style="margin-top: 10px;">Sign Out</button>
  </div>
</div>

<div id="tickerBar" class="ticker-bar"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="js/ticker.js"></script>
<script>
  const SETTINGS_FIELDS = [
    { key: "winProbability", label: "Win Probability", suffix: "%", min: 0, max: 100 },
    { key: "jesterRate", label: "Jester Appearance Rate", suffix: "%", min: 0, max: 100 },
    { key: "avgFreeSpins", label: "Average Free Spins Awarded", suffix: "", min: 3, max: 50 },
    { key: "multiplierFrequency", label: "Multiplier Frequency", suffix: "%", min: 0, max: 100 },
    { key: "jackpotChance", label: "Mega Jackpot Chance", suffix: "%", min: 0, max: 100 },
    { key: "clusterMin", label: "Cluster Size Requirement", suffix: "", min: 3, max: 10 },
  ];

  async function renderPlayers() {
    const list = document.getElementById("playerList");
    const [allPlayers, allRedemptions, globalSettings] = await Promise.all([
      drGetPlayers(), drGetRedemptions(), drGetSettings(),
    ]);
    const players = allPlayers;

    if (players.length === 0) {
      list.innerHTML = '<div class="player-row">No players yet.</div>';
      return;
    }

    list.innerHTML = players.map((p) => {
      const mine = allRedemptions
        .filter((r) => r.uid === p.id)
        .sort((a, b) => b.createdAt - a.createdAt);

      const redeemHtml = mine.length === 0 ? "" : `
        <div class="redeem-list">
          <div class="redeem-list-label">Redemption Codes</div>
          ${mine.map((r) => `
            <div class="redeem-row" data-code="${r.code}">
              <span class="redeem-code-sm">${r.code}</span>
              <span class="redeem-amt-sm">${r.amount.toLocaleString()} cr</span>
              <span class="redeem-status ${r.status}">${r.status}</span>
              ${r.status === "pending" ? '<button class="fulfillBtn">Mark Fulfilled</button>' : ""}
            </div>
          `).join("")}
        </div>
      `;

      const approved = !!p.approved;
      const referredByPlayer = p.referredBy ? players.find((x) => x.id === p.referredBy) : null;
      const referredCount = players.filter((x) => x.referredBy === p.id).length;
      const effective = Object.assign({}, globalSettings, p.settingsOverride || {});

      const settingsSlidersHtml = SETTINGS_FIELDS.map((f) => `
        <div class="setting-row" data-key="${f.key}" data-suffix="${f.suffix}">
          <label>${f.label} <span class="val">${effective[f.key]}${f.suffix}</span></label>
          <input type="range" class="ovInput" min="${f.min}" max="${f.max}" value="${effective[f.key]}">
        </div>
      `).join("");

      return `
        <div class="player-row" data-uid="${p.id}">
          <div class="email">
            ${p.email}
            ${p.role === "admin" ? '<span class="approval-badge approved">You (Admin)</span>' : ""}
            <span class="approval-badge ${approved ? "approved" : "pending"}">${approved ? "Approved" : "Pending"}</span>
          </div>
          <div class="mini-stats">
            <div>Time: <b>${p.timePlayingMinutes || 0}m</b></div>
            <div>Credits: <b>${(p.credits || 0).toLocaleString()}</b></div>
            <div>Played: <b>${(p.creditsPlayed || 0).toLocaleString()}</b></div>
            <div>Won: <b>${(p.creditsWon || 0).toLocaleString()}</b></div>
            <div>Lost: <b>${(p.creditsLost || 0).toLocaleString()}</b></div>
          </div>
          <div class="mini-stats">
            <div>Deposited: <b>${p.hasDeposited ? "Yes" : "No"}</b></div>
            <div>Referral Code: <b>${p.referralCode || "—"}</b></div>
            <div>Referred By: <b>${referredByPlayer ? referredByPlayer.email : "—"}</b></div>
            <div>Referrals Made: <b>${referredCount}</b></div>
          </div>
          ${approved ? "" : '<button class="approveBtn">Approve Account</button>'}
          <div class="add-credits-row">
            <input type="number" placeholder="Amount" class="creditInput" min="1">
            <button class="depositBtn">Add Deposit</button>
            <button class="bonusBtn">Add Bonus</button>
          </div>
          <button type="button" class="player-settings-toggle">Player Game Settings ▾</button>
          <div class="player-settings-panel" style="display:none;">
            ${settingsSlidersHtml}
            <button type="button" class="resetSettingsBtn">Reset to Global Defaults</button>
          </div>
          ${redeemHtml}
        </div>
      `;
    }).join("");

    list.querySelectorAll(".depositBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        const uid = row.dataset.uid;
        const input = row.querySelector(".creditInput");
        const amount = parseInt(input.value, 10);
        if (!amount || amount <= 0) return;
        btn.disabled = true;
        await drAddDeposit(uid, amount);
        input.value = "";
        await renderPlayers();
      });
    });

    list.querySelectorAll(".bonusBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        const uid = row.dataset.uid;
        const input = row.querySelector(".creditInput");
        const amount = parseInt(input.value, 10);
        if (!amount || amount <= 0) return;
        btn.disabled = true;
        await drAddBonusCredits(uid, amount);
        input.value = "";
        await renderPlayers();
      });
    });

    list.querySelectorAll(".fulfillBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".redeem-row");
        btn.disabled = true;
        await drSetRedemptionStatus(row.dataset.code, "fulfilled");
        await renderPlayers();
      });
    });

    list.querySelectorAll(".approveBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        btn.disabled = true;
        await drApprovePlayer(row.dataset.uid);
        await renderPlayers();
      });
    });

    list.querySelectorAll(".player-settings-toggle").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        const row = e.target.closest(".player-row");
        const panel = row.querySelector(".player-settings-panel");
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      });
    });

    list.querySelectorAll(".ovInput").forEach((input) => {
      const settingRow = input.closest(".setting-row");
      const playerRow = input.closest(".player-row");
      const uid = playerRow.dataset.uid;
      const key = settingRow.dataset.key;
      const suffix = settingRow.dataset.suffix;
      input.addEventListener("input", () => {
        settingRow.querySelector(".val").textContent = input.value + suffix;
        drSetPlayerSettingsOverride(uid, { [key]: parseInt(input.value, 10) });
      });
    });

    list.querySelectorAll(".resetSettingsBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".player-row");
        btn.disabled = true;
        await drResetPlayerSettings(row.dataset.uid);
        await renderPlayers();
      });
    });
  }

  async function renderReferrals() {
    const list = document.getElementById("referralList");
    const referrals = await drGetReferrals();

    if (referrals.length === 0) {
      list.innerHTML = '<div class="player-row">No referrals yet.</div>';
      return;
    }

    list.innerHTML = referrals.map((r) => `
      <div class="redeem-row" data-id="${r.id}">
        <span class="redeem-code-sm">${r.referrerEmail} → ${r.newPlayerEmail}</span>
        <span class="redeem-amt-sm">${r.code}</span>
        <span class="redeem-status ${r.rewarded ? "fulfilled" : "pending"}">${r.rewarded ? "rewarded" : "pending"}</span>
        ${r.rewarded ? "" : '<button class="fulfillBtn">Mark Rewarded</button>'}
      </div>
    `).join("");

    list.querySelectorAll(".fulfillBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const row = e.target.closest(".redeem-row");
        btn.disabled = true;
        await drMarkReferralRewarded(row.dataset.id);
        await renderReferrals();
      });
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  async function renderFeedback() {
    const list = document.getElementById("feedbackList");
    const items = await drGetFeedback();

    if (items.length === 0) {
      list.innerHTML = '<div class="player-row">No feedback submitted yet.</div>';
      return;
    }

    list.innerHTML = items.map((f) => {
      const date = new Date(f.createdAt).toLocaleString();
      const kindLabel = f.kind === "bug" ? "Bug" : "Comment";
      return `
        <div class="feedback-item" data-id="${f.id}">
          <div class="feedback-header">
            <span class="feedback-kind-tag ${f.kind === "bug" ? "bug" : ""}">${kindLabel}</span>
            <span class="feedback-email">${escapeHtml(f.email)}</span>
            <span class="feedback-date">${date}</span>
          </div>
          <div class="feedback-msg">${escapeHtml(f.message)}</div>
          ${f.status === "reviewed"
            ? '<span class="redeem-status fulfilled">Reviewed</span>'
            : '<button class="reviewBtn">Mark Reviewed</button>'}
        </div>
      `;
    }).join("");

    list.querySelectorAll(".reviewBtn").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const item = e.target.closest(".feedback-item");
        btn.disabled = true;
        await drMarkFeedbackReviewed(item.dataset.id);
        await renderFeedback();
      });
    });
  }

  async function bindSetting(id, valId, suffix, key, isInt) {
    const input = document.getElementById(id);
    const valEl = document.getElementById(valId);
    const settings = await drGetSettings();
    input.value = settings[key];
    valEl.textContent = settings[key] + suffix;
    input.addEventListener("input", () => {
      const v = isInt ? parseInt(input.value, 10) : Number(input.value);
      valEl.textContent = v + suffix;
      drSaveSettings({ [key]: v });
    });
  }

  (async () => {
    const session = await drRequireSessionOrRedirect("signin.html");
    if (!session) return;
    const me = await drCurrentPlayer();
    if (!me || me.role !== "admin") {
      window.location.href = "dashboard.html";
      return;
    }

    await renderPlayers();
    await renderReferrals();
    await renderFeedback();
    bindSetting("winProbability", "valWinProb", "%", "winProbability", true);
    bindSetting("jesterRate", "valJester", "%", "jesterRate", true);
    bindSetting("avgFreeSpins", "valFreeSpins", "", "avgFreeSpins", true);
    bindSetting("multiplierFrequency", "valMultFreq", "%", "multiplierFrequency", true);
    bindSetting("jackpotChance", "valJackpot", "%", "jackpotChance", true);
    bindSetting("clusterMin", "valCluster", "", "clusterMin", true);
  })();

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await drClearSession();
    window.location.href = "signin.html";
  });

  document.getElementById("viewAsPlayerBtn").addEventListener("click", () => {
    drEnterPlayerView();
    window.location.href = "dashboard.html";
  });

  startTicker(document.getElementById("tickerBar"));
</script>
</body>
</html>
