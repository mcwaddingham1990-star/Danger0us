<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Create Account</title>
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="css/ticker.css">
</head>
<body>
<div class="auth-page" style="background-image: url('images/auth.screens/create-account.png');">
  <div class="auth-card">
    <h1>CREATE ACCOUNT</h1>
    <p class="subtitle">Join Dangerous Rides</p>

    <div class="form-message" id="formMessage"></div>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="field-error" id="emailError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" class="has-toggle" placeholder="Create a password" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="password">👁</button>
        </div>
        <div class="field-error" id="passwordError"></div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" class="has-toggle" placeholder="Confirm your password" autocomplete="new-password">
          <button type="button" class="toggle-visibility" data-target="confirmPassword">👁</button>
        </div>
        <div class="field-error" id="confirmError"></div>
      </div>

      <div class="field">
        <label for="referralCode">Referral Code (optional)</label>
        <div class="input-wrap">
          <input type="text" id="referralCode" placeholder="Have a friend's code? Enter it here" autocomplete="off">
        </div>
        <div class="field-error" id="referralError"></div>
      </div>

      <button type="submit" class="btn-primary">SIGN UP</button>
    </form>

    <p class="below-text">Already have an account? <a href="signin.html">Sign In</a></p>
  </div>
</div>

<div id="tickerBar" class="ticker-bar"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="auth.js"></script>
<script src="js/ticker.js"></script>
<script src="js/bgm.js"></script>
<script>
  const form = document.getElementById("signupForm");
  const message = document.getElementById("formMessage");

  function mapAuthError(err) {
    switch (err.code) {
      case "auth/email-already-in-use": return "An account with that email already exists.";
      case "auth/invalid-email": return "Enter a valid email address.";
      case "auth/weak-password": return "Password must be at least 8 characters.";
      default: return "Account creation failed. Please try again.";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const referralCode = document.getElementById("referralCode").value.trim();

    const emailError = document.getElementById("emailError");
    const passwordError = document.getElementById("passwordError");
    const confirmError = document.getElementById("confirmError");
    const referralError = document.getElementById("referralError");

    let valid = true;

    if (!isValidEmail(email)) {
      showFieldError(emailError, "Enter a valid email address.");
      valid = false;
    } else {
      showFieldError(emailError, "");
    }

    if (password.length < 8) {
      showFieldError(passwordError, "Password must be at least 8 characters.");
      valid = false;
    } else {
      showFieldError(passwordError, "");
    }

    if (confirmPassword !== password || confirmPassword.length === 0) {
      showFieldError(confirmError, "Passwords do not match.");
      valid = false;
    } else {
      showFieldError(confirmError, "");
    }

    showFieldError(referralError, "");
    if (referralCode) {
      const found = await drLookupReferralCode(referralCode);
      if (!found) {
        showFieldError(referralError, "That referral code wasn't found — check it, or leave it blank.");
        valid = false;
      }
    }

    if (!valid) {
      showMessage(message, "Please fix the errors below.", "error");
      return;
    }

    showMessage(message, "Creating account…", "success");

    drSignUp(email, password, referralCode)
      .then(() => {
        showMessage(message, "Account created. Redirecting…", "success");
        setTimeout(() => { window.location.href = "dashboard.html"; }, 600);
      })
      .catch((err) => {
        showMessage(message, mapAuthError(err), "error");
      });
  });

  startTicker(document.getElementById("tickerBar"));
</script>
</body>
</html>
