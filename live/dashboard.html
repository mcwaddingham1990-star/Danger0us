<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Dashboard</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/ticker.css">
</head>
<body>
<div class="scroll-page" style="background-image: url('images/dash.screens/dashboard-scroll.jpg');">
  <div class="scroll-panel">
    <h1>YOUR STATS</h1>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Time Playing</div>
        <div class="value" id="statTime">0m</div>
      </div>
      <div class="stat-card">
        <div class="label">Current Credits</div>
        <div class="value" id="statCredits">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Credits Played</div>
        <div class="value" id="statPlayed">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Credits Won</div>
        <div class="value" id="statWon">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Credits Lost</div>
        <div class="value" id="statLost">0</div>
      </div>
    </div>

    <div class="deposit-history">
      <div class="label">Credits Deposit History</div>
      <div id="depositList"></div>
    </div>

    <button class="btn-primary" id="goToGamesBtn">GO TO GAMES</button>
    <button class="btn-secondary" id="signOutBtn">Sign Out</button>
  </div>
</div>

<div id="tickerBar" class="ticker-bar"></div>

<div class="modal-overlay" id="gamesModal">
  <div class="modal-box">
    <h2>CHOOSE YOUR GAME</h2>
    <a class="game-option blue" href="game.html">
      <span class="name">Blue Diamonds</span>
      <span class="tag">PLAY</span>
    </a>
    <div class="game-option red">
      <span class="name">Red Devil</span>
      <span class="tag">COMING SOON</span>
    </div>
    <div class="modal-close"><a href="#" id="closeModal">Close</a></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/ticker.js"></script>
<script>
  const session = drRequireSessionOrRedirect("signin.html");
  if (session) {
    const player = drCurrentPlayer();
    if (player) {
      if (player.role === "admin") {
        window.location.href = "admin.html";
      } else {
        document.getElementById("statTime").textContent = (player.timePlayingMinutes || 0) + "m";
        document.getElementById("statCredits").textContent = (player.credits || 0).toLocaleString();
        document.getElementById("statPlayed").textContent = (player.creditsPlayed || 0).toLocaleString();
        document.getElementById("statWon").textContent = (player.creditsWon || 0).toLocaleString();
        document.getElementById("statLost").textContent = (player.creditsLost || 0).toLocaleString();

        const list = document.getElementById("depositList");
        const history = player.depositHistory || [];
        if (history.length === 0) {
          list.innerHTML = '<div class="deposit-row"><span>No deposits yet</span></div>';
        } else {
          list.innerHTML = history.slice().reverse().map((d) => {
            const date = new Date(d.at).toLocaleDateString();
            return `<div class="deposit-row"><span>${d.note || "Deposit"} — ${date}</span><span class="amt">+${d.amount}</span></div>`;
          }).join("");
        }
      }
    }
  }

  document.getElementById("signOutBtn").addEventListener("click", () => {
    drClearSession();
    window.location.href = "signin.html";
  });

  const modal = document.getElementById("gamesModal");
  document.getElementById("goToGamesBtn").addEventListener("click", () => modal.classList.add("open"));
  document.getElementById("closeModal").addEventListener("click", (e) => {
    e.preventDefault();
    modal.classList.remove("open");
  });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("open");
  });

  startTicker(document.getElementById("tickerBar"));
</script>
</body>
</html>
