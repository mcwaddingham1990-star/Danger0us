<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Forgot Password</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-page" style="background-image: url('images/auth.screens/forgot-password.png');">
  <div class="auth-card">
    <h1>FORGOT PASSWORD?</h1>
    <p class="subtitle">No worries, we'll send you reset instructions.</p>

    <div class="form-message" id="formMessage"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="field-error" id="emailError"></div>
      </div>

      <button type="submit" class="btn-primary">SEND RESET LINK</button>
    </form>

    <p class="center-link"><a href="signin.html">Back to Sign In</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="auth.js"></script>
<script>
  const form = document.getElementById("resetForm");
  const message = document.getElementById("formMessage");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const emailError = document.getElementById("emailError");

    if (!isValidEmail(email)) {
      showFieldError(emailError, "Enter a valid email address.");
      showMessage(message, "Please fix the errors below.", "error");
      return;
    }

    showFieldError(emailError, "");

    drAuth.sendPasswordResetEmail(email)
      .catch((err) => {
        // Swallow "no account for this email" so we don't leak which
        // emails are registered — everything else surfaces normally.
        if (err.code !== "auth/user-not-found") throw err;
      })
      .then(() => {
        showMessage(message, "If an account exists for that email, reset instructions are on the way.", "success");
        form.reset();
      })
      .catch(() => {
        showMessage(message, "Something went wrong. Please try again.", "error");
      });
  });
</script>
</body>
</html>
