<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides — Blue Diamonds</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="top-bar">
  <a href="dashboard.html">&larr; Dashboard</a>
  <span>BLUE DIAMONDS</span>
  <span>
    <button id="btnMute" class="mute-btn" title="Mute/unmute sound">🔊</button>
    <span id="creditsTop">0 cr</span>
  </span>
</div>

<div class="cabinet-wrap">
  <div class="cabinet-frame" id="cabinetFrame">
    <div class="card-stream" id="cardStream"></div>

    <div class="reel-window" id="reelWindow"></div>

    <div class="win-flash-layer" id="winFlashLayer"></div>

    <div class="hud">
      <div class="hud-item">
        <div class="hud-label">Bet</div>
        <div class="hud-value" id="hudBet">5</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">Credits</div>
        <div class="hud-value" id="hudCredits">0</div>
      </div>
      <div class="hud-item">
        <div class="hud-label">Last Win</div>
        <div class="hud-value" id="hudWin">0</div>
      </div>
    </div>

    <div class="bonus-overlay" id="bonusAnnounce" style="background-image:url('images/dash.screens/bonus-spins-scroll.png');">
      <h2>BONUS SPINS TRIGGERED</h2>
      <p>Jesters found: <span id="jesterCountText">0</span></p>
      <p class="big" id="freeSpinsAwarded">0</p>
      <p>FREE SPINS</p>
    </div>

    <div class="bonus-overlay" id="bonusPlay" style="background-image:url('images/dash.screens/bonus-play-scroll.png');">
      <div class="bonus-reel-window" id="bonusReelWindow"></div>
      <div class="hud" style="bottom: 6%;">
        <div class="hud-item">
          <div class="hud-label">Free Spins Left</div>
          <div class="hud-value" id="bonusSpinsLeft">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">Multiplier</div>
          <div class="hud-value" id="bonusMultiplier">1x</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">Bonus Win</div>
          <div class="hud-value" id="bonusWinTotal">0</div>
        </div>
      </div>
    </div>

    <div class="bonus-overlay" id="bonusEnd">
      <h2>BONUS COMPLETE</h2>
      <p>TOTAL FREE SPIN WINS</p>
      <p class="big" id="endTotalWin">0</p>
      <p>Biggest Cascade: <span id="endBiggestCascade">0</span> symbols</p>
      <p>Highest Multiplier: <span id="endHighestMult">1x</span></p>
      <p>Jackpot: <span id="endJackpotStatus">NO WIN</span></p>
      <div>
        <button id="btnPlayAgain">PLAY AGAIN</button>
        <button id="btnReturnToGame">RETURN TO GAME</button>
      </div>
    </div>
  </div>
</div>

<div class="control-bar">
  <button class="ctrl-btn" id="btnMinBetFloat">
    <span class="ctrl-label">Min</span>
  </button>
  <div class="ctrl-btn bet-stepper">
    <button type="button" class="stepper-btn" id="btnBetDownFloat" aria-label="Lower bet">&minus;</button>
    <div class="stepper-val">
      <span class="ctrl-label">Bet</span>
      <span class="ctrl-sub" id="betVal">1.0</span>
    </div>
    <button type="button" class="stepper-btn" id="btnBetUpFloat" aria-label="Raise bet">+</button>
  </div>
  <button class="ctrl-btn" id="btnMaxBetFloat">
    <span class="ctrl-label">Max</span>
  </button>
  <button class="ctrl-btn spin" id="btnSpinFloat">
    <span class="ctrl-label">Spin</span>
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data.js"></script>
<script src="js/game-config.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/card-flurry.js"></script>
<script src="js/game.js"></script>
</body>
</html>
