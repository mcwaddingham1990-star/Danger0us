<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Rides</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    background: #05070c;
    color: #eef4ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box {
    max-width: 420px;
    padding: 32px;
  }
  h1 {
    color: #4fa3ff;
    letter-spacing: 0.04em;
  }
  a {
    color: #4fa3ff;
  }
  #who {
    color: #9db6d8;
    font-size: 0.9rem;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="box">
  <h1>DANGEROUS RIDES</h1>
  <p>You're signed in. The slot cabinet game is still being built here — check back soon.</p>
  <p id="who"></p>
  <p><a href="#" id="signOut">Sign out</a> · <a href="signin.html">Sign in page</a></p>
</div>
<script>
  const raw = localStorage.getItem("dr_session");
  if (raw) {
    try {
      const session = JSON.parse(raw);
      document.getElementById("who").textContent = "Signed in as " + session.email;
    } catch (e) {}
  }
  document.getElementById("signOut").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("dr_session");
    window.location.href = "signin.html";
  });
</script>
</body>
</html>
